<div class="login-page">
  <div class="login-card">

    <div class="login-card__logo">
      <svg viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="10" fill="#2563eb"/>
        <path d="M10 28 L20 12 L30 28" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 22 H26" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span>CoachDiary</span>
    </div>

    <h1 class="login-card__title">{{ isSignUp ? 'Create account' : 'Welcome back' }}</h1>
    <p class="login-card__sub">{{ isSignUp ? 'Start coaching smarter.' : 'Sign in to your coaching workspace.' }}</p>

    @if (mode === 'social') {
      <div class="social-buttons">
        <button class="social-btn" (click)="signInGoogle()">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <button class="social-btn" (click)="signInApple()">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.4c1.3.07 2.2.74 2.96.77 1.18-.23 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.39-1.32 2.76-2.41 4.02zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
          </svg>
          Continue with Apple
        </button>

        <button class="social-btn" (click)="signInFacebook()">
          <svg viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Continue with Facebook
        </button>

        <div class="divider"><span>or</span></div>

        <button class="email-toggle" (click)="mode = 'email'">
          Continue with email
        </button>
      </div>
    }

    @if (mode === 'email') {
      <form class="email-form" (ngSubmit)="submitEmail()">
        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="coach@team.com" autocomplete="email" required/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
        </div>

        @if (error()) {
          <p class="form-error">{{ error() }}</p>
        }

        <button type="submit" class="btn btn--primary btn--full" [disabled]="loading()">
          {{ loading() ? 'Please wait…' : (isSignUp ? 'Create account' : 'Sign in') }}
        </button>

        <button type="button" class="link-btn" (click)="isSignUp = !isSignUp">
          {{ isSignUp ? 'Already have an account? Sign in' : "Don't have an account? Sign up" }}
        </button>

        <button type="button" class="link-btn" (click)="mode = 'social'">
          ← Back to social login
        </button>
      </form>
    }

  </div>
</div>
