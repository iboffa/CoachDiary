<div class="settings-page">
  <div class="page-header">
    <div class="page-header__title">
      <h1>Settings</h1>
      <p>Manage your account.</p>
    </div>
  </div>

  <div class="page-body">
    <div class="card settings-card">
      <h2>Account</h2>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [value]="email" disabled />
      </div>
    </div>

    <div class="card settings-card">
      <h2>Change password</h2>
      <form (ngSubmit)="savePassword()">
        <div class="form-group">
          <label>New password</label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label>Confirm password</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••" autocomplete="new-password" />
        </div>

        @if (error()) {
          <p class="form-error">{{ error() }}</p>
        }
        @if (success()) {
          <p class="form-success">{{ success() }}</p>
        }

        <button type="submit" class="btn btn--primary" [disabled]="saving()">
          {{ saving() ? 'Saving…' : 'Update password' }}
        </button>
      </form>
    </div>

    <div class="card settings-card">
      <h2>Session</h2>
      <button class="btn btn--danger" (click)="signOut()">Log out</button>
    </div>
  </div>
</div>
